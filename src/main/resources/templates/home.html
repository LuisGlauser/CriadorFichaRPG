<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Fichas RPG</title>
    <link rel="stylesheet" th:href="@{/css/wizard.css}">
    <style>
        body { min-height:100vh; }
        .home { max-width:1100px; margin:0 auto; padding:3rem 1.5rem; }
        .home-header { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }
        .home-header h1 { margin:0; }
        .characters-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
        .character-card { border:2px solid var(--parchment-dark); border-radius:8px; padding:1.2rem; background:rgba(255,255,255,.72); box-shadow:0 3px 8px rgba(0,0,0,.08); }
        .character-card h2 { margin:.1rem 0 .6rem; }
        .character-card p { margin:.35rem 0; color:var(--ink-mid); }
        .card-actions { display:flex; gap:.6rem; margin-top:1rem; }
        .btn-home { display:inline-block; padding:.65rem 1rem; border-radius:4px; text-decoration:none; font-weight:700; cursor:pointer; border:2px solid var(--gold); background:linear-gradient(135deg,var(--red-dark),var(--red-light)); color:var(--gold-light); }
        .btn-home.secondary { background:transparent; color:var(--ink); }
        .empty { padding:2rem; text-align:center; border:2px dashed var(--parchment-dark); border-radius:8px; }
    </style>
</head>
<body>
<div class="home">
    <div class="home-header">
        <div>
            <h1>⚔ Criador de Fichas RPG</h1>
            <p>Selecione uma ficha salva ou crie um novo personagem.</p>
        </div>
        <a class="btn-home" th:href="@{/character/create/step-1}">+ Criar personagem</a>
    </div>

    <div th:if="${#lists.isEmpty(characters)}" class="empty">
        <h2>Nenhum personagem salvo</h2>
        <p>Comece criando sua primeira ficha.</p>
        <a class="btn-home" th:href="@{/character/create/step-1}">Criar primeira ficha</a>
    </div>

    <div class="characters-grid" th:unless="${#lists.isEmpty(characters)}">
        <article class="character-card" th:each="saved : ${characters}">
            <h2 th:text="${saved.name}">Personagem</h2>
            <p><strong>Classe:</strong> <span th:text="${saved.className}">Classe</span></p>
            <p><strong>Raça:</strong> <span th:text="${saved.speciesName}">Raça</span></p>
            <p><strong>Nível:</strong> <span th:text="${saved.level}">1</span></p>
            <p><strong>Última alteração:</strong> <span th:text="${#temporals.format(saved.updatedAt, 'dd/MM/yyyy HH:mm')}">data</span></p>
            <div class="card-actions">
                <a class="btn-home" th:href="@{/character/view/{id}(id=${saved.id})}">Visualizar ficha</a>
            </div>
        </article>
    </div>
</div>
</body>
</html>
